apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp
  template:
    metadata:
      labels:
        app: scaletestapp
      annotations:
        # Явно указываем платформу (для Kubernetes ≥ 1.24)
        container.kubernetes.io/os-features: "amd64"
    spec:
      containers:
      - name: scaletestapp
        image: my-scaletestapp:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: "30Mi"
          requests:
            memory: "20Mi"
